<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoAudit — every claim, sourced</title>
<meta name="description" content="Real owner complaint records, recalls and
official safety data, turned into one answer: should you buy this car?">
<style>
  :root {
    --bg:#0a0a0b; --card:#161618; --red:#d61c24;
    --ink:#f5f5f7; --ink2:#9a9ca2; --line:#26262a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:620px;margin:0 auto;padding:40px 16px 72px}
  header{text-align:center;margin-bottom:34px}
  .mark{font:900 40px/1 Arial Black,Arial,sans-serif;letter-spacing:-1px}
  .mark span{background:var(--red);padding:2px 8px;border-radius:3px}
  .tag{color:var(--ink2);font-size:13px;letter-spacing:.14em;
    text-transform:uppercase;margin-top:12px}
  .links{display:flex;gap:10px;justify-content:center;margin-top:22px;
    flex-wrap:wrap}
  .links a{color:var(--ink);text-decoration:none;border:1px solid var(--line);
    padding:11px 20px;border-radius:999px;font-size:14px;font-weight:600}
  .links a.primary{background:var(--red);border-color:var(--red)}
  .card{display:flex;gap:14px;background:var(--card);border-radius:12px;
    padding:12px;margin-bottom:12px;text-decoration:none;color:inherit;
    border:1px solid var(--line)}
  .card img{width:132px;height:76px;object-fit:cover;border-radius:7px;
    background:#000;flex:none}
  .meta{display:flex;flex-direction:column;justify-content:center;min-width:0}
  .kind{color:var(--red);font-size:11px;font-weight:700;letter-spacing:.1em;
    text-transform:uppercase}
  .card h2{font-size:15px;margin:3px 0 2px;line-height:1.3;font-weight:600}
  .car{color:var(--ink2);font-size:13px}
  .empty{color:var(--ink2);text-align:center;padding:40px 0}
  footer{color:var(--ink2);font-size:12px;text-align:center;margin-top:34px;
    line-height:1.7}
  @media(max-width:420px){.card img{width:104px;height:60px}}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="mark">AUTO<span>AUDIT</span></div>
      <div class="tag">Real data · Real problems</div>
      <div class="links">
        <a class="primary" href="https://www.youtube.com/@AutoAudit" target="_blank" rel="noopener">YouTube</a>
        <a href="https://www.instagram.com/autoauditofficial/" target="_blank" rel="noopener">Instagram</a>
      </div>
    </header>
      <p class="empty">First video lands shortly.</p>

    <footer>
      Every figure sourced. Nothing guessed.<br>
      Vehicle data: NHTSA Office of Defects Investigation.
    </footer>
  </div>
</body>
</html>
